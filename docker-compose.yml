services:
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board}
      POSTGRES_DB: ${POSTGRES_DB:-board}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
